[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-calculator"
version = "0.1.0"
description = "Local Dota 2 Fantasy 2026 calculator with Python-generated data snapshots."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["fantasy_calculator*"]

[tool.setuptools.package-data]
fantasy_calculator = ["static/*"]
